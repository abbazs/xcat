name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test
          cache-on-failure: true

      - name: Run tests
        run: cargo test --workspace

  build:
    name: Build ${{ matrix.target }}
    needs: [lint, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: xcat
            asset_name: xcat-linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: xcat
            asset_name: xcat-linux-x86_64-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: xcat
            asset_name: xcat-linux-aarch64
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            artifact_name: xcat
            asset_name: xcat-linux-armv7
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: xcat
            asset_name: xcat-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: xcat
            asset_name: xcat-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: xcat.exe
            asset_name: xcat-windows-x86_64.exe
          - os: windows-latest
            target: i686-pc-windows-msvc
            artifact_name: xcat.exe
            asset_name: xcat-windows-i686.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: runner.os == 'Linux'
        run: |
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl)
              sudo apt-get update && sudo apt-get install -y musl-tools
              ;;
            aarch64-unknown-linux-gnu)
              sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
              ;;
            armv7-unknown-linux-gnueabihf)
              sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf
              ;;
          esac

      - name: Configure cross-compilation linkers
        if: runner.os == 'Linux'
        run: |
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
              ;;
            armv7-unknown-linux-gnueabihf)
              echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> $GITHUB_ENV
              ;;
          esac

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.target }}
          cache-on-failure: true

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary
        if: runner.os != 'Windows'
        run: |
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl|x86_64-unknown-linux-gnu)
              strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
              ;;
            aarch64-unknown-linux-gnu)
              aarch64-linux-gnu-strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
              ;;
            armv7-unknown-linux-gnueabihf)
              arm-linux-gnueabihf-strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
              ;;
            *-apple-darwin)
              strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
              ;;
          esac

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.target }}" in
            *-pc-windows-msvc)
              cp target/${{ matrix.target }}/release/xcat.exe dist/${{ matrix.asset_name }}
              cd dist && 7z a "${{ matrix.asset_name }}.zip" "${{ matrix.asset_name }}" && cd ..
              ;;
            *)
              cp target/${{ matrix.target }}/release/xcat dist/${{ matrix.asset_name }}
              cd dist && tar czf "${{ matrix.asset_name }}.tar.gz" "${{ matrix.asset_name }}" && cd ..
              ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ matrix.asset_name }}
          path: dist/
          retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate date-based tag
        id: tag
        run: |
          DATE=$(date -u +'%Y.%m.%d')
          # Find existing tags for today and increment counter
          LATEST=$(git tag --list "v${DATE}.*" --sort=-version:refname | head -n1 || echo "")
          if [[ -n "$LATEST" ]]; then
            # Extract counter from v2026.03.21.N
            COUNTER=$(echo "$LATEST" | sed 's/.*\.\([0-9]*\)/\1/')
            COUNTER=$((COUNTER + 1))
          else
            COUNTER=1
          fi
          TAG="v${DATE}.${COUNTER}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Generated tag: ${TAG}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*-xcat-*"
          merge-multiple: true

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-assets/ \;
          find artifacts -type f ! \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-assets/ \;
          echo "Release assets:"
          ls -la release-assets/

      - name: Generate release notes
        id: release_notes
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -n1 2>/dev/null || echo "")

          {
            echo "## Release ${TAG}"
            echo ""
            if [[ -n "$PREVIOUS_TAG" ]]; then
              echo "### Changes since ${PREVIOUS_TAG}"
              echo ""
              git log --pretty=format:"- %s (%h)" "${PREVIOUS_TAG}..HEAD"
            else
              echo "### Recent Changes"
              echo ""
              git log --pretty=format:"- %s (%h)" -10
            fi
            echo ""
            echo "## Downloads"
            echo ""
            echo "**Linux:**"
            echo "- x86_64 (glibc): [\`xcat-linux-x86_64\`](https://github.com/${{ github.repository }}/releases/download/${TAG}/xcat-linux-x86_64)"
            echo "- x86_64 (musl): [\`xcat-linux-x86_64-musl\`](https://github.com/${{ github.repository }}/releases/download/${TAG}/xcat-linux-x86_64-musl)"
            echo "- ARM64: [\`xcat-linux-aarch64\`](https://github.com/${{ github.repository }}/releases/download/${TAG}/xcat-linux-aarch64)"
            echo "- ARMv7: [\`xcat-linux-armv7\`](https://github.com/${{ github.repository }}/releases/download/${TAG}/xcat-linux-armv7)"
            echo ""
            echo "**macOS:**"
            echo "- ARM64 (Apple Silicon): [\`xcat-macos-aarch64\`](https://github.com/${{ github.repository }}/releases/download/${TAG}/xcat-macos-aarch64)"
            echo "- x86_64 (Intel): [\`xcat-macos-x86_64\`](https://github.com/${{ github.repository }}/releases/download/${TAG}/xcat-macos-x86_64)"
            echo ""
            echo "**Windows:**"
            echo "- x86_64: [\`xcat-windows-x86_64.exe\`](https://github.com/${{ github.repository }}/releases/download/${TAG}/xcat-windows-x86_64.exe)"
            echo "- x86 (32-bit): [\`xcat-windows-i686.exe\`](https://github.com/${{ github.repository }}/releases/download/${TAG}/xcat-windows-i686.exe)"
          } > release_notes.md

      - name: Create tag and release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: release_notes.md
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: false
