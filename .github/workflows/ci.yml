name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test
          cache-on-failure: true

      - name: Run tests
        run: cargo test --workspace

  build:
    name: Build ${{ matrix.target }}
    needs: [lint, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: xcat
            asset_name: xcat-linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: xcat
            asset_name: xcat-linux-x86_64-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: xcat
            asset_name: xcat-linux-aarch64
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            artifact_name: xcat
            asset_name: xcat-linux-armv7
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: xcat
            asset_name: xcat-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: xcat
            asset_name: xcat-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: xcat.exe
            asset_name: xcat-windows-x86_64.exe
          - os: windows-latest
            target: i686-pc-windows-msvc
            artifact_name: xcat.exe
            asset_name: xcat-windows-i686.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: runner.os == 'Linux'
        run: |
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl)
              sudo apt-get update && sudo apt-get install -y musl-tools
              ;;
            aarch64-unknown-linux-gnu)
              sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
              ;;
            armv7-unknown-linux-gnueabihf)
              sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf
              ;;
          esac

      - name: Configure cross-compilation linkers
        if: runner.os == 'Linux'
        run: |
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
              ;;
            armv7-unknown-linux-gnueabihf)
              echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> $GITHUB_ENV
              ;;
          esac

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.target }}
          cache-on-failure: true

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary
        if: runner.os != 'Windows'
        run: |
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl|x86_64-unknown-linux-gnu)
              strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
              ;;
            aarch64-unknown-linux-gnu)
              aarch64-linux-gnu-strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
              ;;
            armv7-unknown-linux-gnueabihf)
              arm-linux-gnueabihf-strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
              ;;
            *-apple-darwin)
              strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
              ;;
          esac

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.target }}" in
            *-pc-windows-msvc)
              cp target/${{ matrix.target }}/release/xcat.exe dist/${{ matrix.asset_name }}
              cd dist && 7z a "${{ matrix.asset_name }}.zip" "${{ matrix.asset_name }}" && cd ..
              ;;
            *)
              cp target/${{ matrix.target }}/release/xcat dist/${{ matrix.asset_name }}
              cd dist && tar czf "${{ matrix.asset_name }}.tar.gz" "${{ matrix.asset_name }}" && cd ..
              ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ matrix.asset_name }}
          path: dist/
          retention-days: 7
