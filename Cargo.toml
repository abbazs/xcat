[package]
name = "xcat"
version = "0.1.1"
edition = "2024"
description = "A Rust tool that recursively traverses directories, maps file structures, and consolidates all file contents into a single output file for enhanced analysis with AI systems like Grok[...]"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
colored = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ignore = "0.4"
# wayland-data-control enables the native Wayland clipboard backend on Linux;
# without it arboard only supports X11 and silently fails on Wayland sessions.
# default-features = false drops image-data, which xcat (text-only) never uses.
arboard = { version = "3.3", default-features = false, features = ["wayland-data-control"] }
glob = "0.3"
globset = "0.4.16"
# detect piped stdin vs interactive
atty = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"